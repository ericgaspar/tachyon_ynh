packaging_format = 2

id = "tachyon"
name = "Tachyon"
description.en = "Simple, modern, lightweight & fast web-based e-mail client"
description.fr = "Client de messagerie Web simple, moderne, léger et rapide"

version = "4.2.3~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-only"
website = "https://tachyonmail.app/"
admindoc = "https://tachyonmail.app/#/docs"
code = "https://github.com/kimusan/Tachyon"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = true

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/tachyon"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

        [resources.sources.main]
        url = "https://github.com/kimusan/Tachyon/releases/latest/download/tachyon-latest.tar.gz"
        sha256 = "d776c2e05e1898f7819b8570715c669383693511c6edfe7ae8f287e68a6200e0"
        in_subdir = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "^tachyon-[0-9\\.\\-]*tar.gz$"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"
    
    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        #"mariadb-server",
        "php8.5-uuid",
        "php8.5-imagick",
        "php8.5-sqlite3",
        "php8.5-tidy",
        "php8.5-dom",
        "php8.5-intl",
        #"php8.5-mysql",
        "php8.5-curl",
        "php8.5-gd",
        "php8.5-cli",
        "php8.5-xml",
        "php8.5-mbstring",
    ]

    #[resources.database]
    #type = "mysql"
